<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
<title>风扇宠物</title>
<link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div class="pet" id="pet" data-state="idle">
    <!-- 情绪气泡 -->
    <div class="bubble" id="bubble" hidden></div>

    <!-- 翻转层：朝向由内联 transform 控制；呼吸/跳跃动画在内层 .body 上，
         两层分开才不会互相覆盖 -->
    <div class="body-flip" id="bodyFlip">
    <div class="body">
      <!-- 风扇外壳 -->
      <div class="cage">
        <div class="blades" id="blades">
          <i></i><i></i><i></i><i></i>
        </div>
        <div class="hub">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="mouth"></span>
        </div>
      </div>
      <div class="stand"></div>
      <div class="base"></div>
    </div>
    </div>


    <!-- 四叶草菜单：悬停展开，四个小功能各占一片叶子 -->
    <div class="clover" id="clover" hidden>
      <span class="clover-core" aria-hidden="true"></span>
      <button class="leaf leaf-tl" data-tool="memory" title="清理内存" aria-label="清理内存">
        <svg class="leaf-ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="10" y="10" width="4" height="4" rx="1" fill="currentColor"/><path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="leaf-label">内存</span>
      </button>
      <button class="leaf leaf-tr" data-tool="ai" title="AI 小助手" aria-label="AI 小助手">
        <svg class="leaf-ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 0 1 8-8h2a8 8 0 0 1 8 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="leaf-label">问问</span>
      </button>
      <button class="leaf leaf-bl" data-tool="pomodoro" title="番茄钟" aria-label="番茄钟">
        <svg class="leaf-ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="leaf-label">专注</span>
      </button>
      <button class="leaf leaf-br" data-tool="fortune" title="今日运势" aria-label="今日运势">
        <svg class="leaf-ico" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="7.3" r="3.3"/><circle cx="16.7" cy="12" r="3.3"/><circle cx="12" cy="16.7" r="3.3"/><circle cx="7.3" cy="12" r="3.3"/></g></svg>
        <span class="leaf-label">运势</span>
      </button>
    </div>

    <!-- 功能面板：一次只开一个 -->
    <div class="tool-panel" id="toolPanel" hidden>
      <div class="tp-head">
        <span class="tp-title" id="tpTitle"></span>
        <button class="tp-close" id="tpClose" aria-label="关闭">×</button>
      </div>
      <div class="tp-body" id="tpBody"></div>
    </div>

    <!-- 睡觉时飘出的 Z -->
    <div class="zzz" id="zzz" hidden><span>z</span><span>z</span><span>z</span></div>
  </div>
  <script src="pet.js"></script>
  <script src="quick-panel.js"></script>
</body>
</html>
